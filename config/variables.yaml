variables:

  # ===========================================================================
  # Stage 1: Sample Manifest (preserved — identifier columns, not regression vars)
  # ===========================================================================

  manifest:
    stage: 1
    source: outputs/1.4_AssembleManifest
    file_name: master_sample_manifest.parquet
    columns:
      - file_name
      - ceo_id
      - ceo_name
      - gvkey
      - ff12_code
      - ff12_name
      - start_date
    description: Master sample manifest with CEO, firm, and industry identifiers

  # ===========================================================================
  # Stage 2: Text/Linguistic Variables
  # ===========================================================================

  neg_call:
    stage: 2
    source: outputs/2_Textual_Analysis/2.2_Variables
    file_pattern: linguistic_variables_{year}.parquet
    column: NegCall
    formula: "Ratio of negative words to total words in the entire call, based on LM 2011 negative-words list. Per DWZ 2021 Appendix Table A.1: 'percentage of negative words in all words spoken by the CEO, CFO and analysts attending the call.'"
    reference: dzielinski2021 (Section 4.4, p.18; Appendix Table A.1, p.54)
    role: control
    suites: [H11, H11-Lag1, H11-Lag2, H23, H24, H24b, H25, H5]
    description: Entire-call negative sentiment percentage.

  unc_ans_ceo:
    stage: 2
    source: outputs/2_Textual_Analysis/2.2_Variables
    file_pattern: linguistic_variables_{year}.parquet
    column: UncAnsCEO
    formula: "CEO Q&A uncertainty (%) = UnctWordsAnsCEO / WordsAnsCEO (DWZ 2021 Eqn 2). Uncertainty wordlist = LM 2011 Master Dictionary 'uncertainty' list (297 words, Aug 2014 version). CEO identified via Execucomp ceoann field."
    reference: dzielinski2021 (Section 4.2, Eqn 2, p.13; Appendix Table A.1, p.54)
    role: iv
    suites: [H1, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: "CEO-only Q&A uncertainty percentage."

  unc_ans_mgr:
    stage: 2
    source: outputs/2_Textual_Analysis/2.2_Variables
    file_pattern: linguistic_variables_{year}.parquet
    column: UncAnsMgr
    formula: "Manager Q&A uncertainty (%) = (count of LM 2011 uncertainty-wordlist words spoken by managers in Q&A segment) / (total words spoken by managers in Q&A segment). Construction strategy follows DWZ 2021 Eqn (2); manager-pool identification follows BGT 2018 segment-split code (iangow/bgt replication). 'Manager' pool includes CEO plus other managerial speakers, extending DWZ which separates CEO/CFO."
    reference: dzielinski2021 (measurement strategy, Eqn 2); bushee2018 (manager-pool identification via iangow/bgt); thesis extension to pooled manager speakers
    role: iv
    suites: [H1, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: "Manager Q&A uncertainty percentage (all managers including CEO)."

  unc_pre_ceo:
    stage: 2
    source: outputs/2_Textual_Analysis/2.2_Variables
    file_pattern: linguistic_variables_{year}.parquet
    column: UncPreCEO
    formula: "CEO Presentation uncertainty (%) = UnctWordsPreCEO / WordsPreCEO (DWZ 2021 Eqn 1). Uncertainty wordlist = LM 2011 (297 words)."
    reference: dzielinski2021 (Section 4.2, Eqn 1, p.13; Appendix Table A.1, p.54)
    role: iv
    suites: [H1, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: CEO-only presentation uncertainty percentage.

  unc_pre_mgr:
    stage: 2
    source: outputs/2_Textual_Analysis/2.2_Variables
    file_pattern: linguistic_variables_{year}.parquet
    column: UncPreMgr
    formula: "Manager Presentation uncertainty (%) = (count of LM 2011 uncertainty-wordlist words by managers in Presentation segment) / (total manager words in Presentation segment). Construction strategy follows DWZ 2021 Eqn (1); manager-pool identification and Pres/Ans segment split follow BGT 2018 via iangow/bgt replication code."
    reference: dzielinski2021 (measurement strategy, Eqn 1); bushee2018 (segment split + manager pool); thesis extension to pooled manager speakers
    role: iv
    suites: [H1, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: Manager presentation uncertainty percentage.

  unc_que:
    stage: 2
    source: outputs/2_Textual_Analysis/2.2_Variables
    file_pattern: linguistic_variables_{year}.parquet
    column: UncQue
    formula: "Analyst Q&A uncertainty (%) = UnctWordsQue / WordsQue (DWZ 2021 Eqn 3). Uncertainty wordlist = LM 2011 (297 words)."
    reference: dzielinski2021 (Section 4.2, Eqn 3, p.13; Appendix Table A.1, p.54)
    role: control
    suites: [H11, H11-Lag1, H11-Lag2, H14b, H23, H24, H24b, H25, H5, H7, H7b, H7c, H7d, H7e]
    description: "Analyst Q&A uncertainty percentage."

  # ===========================================================================
  # Stage 3: Financial / Market Variables
  # ===========================================================================

  bgtavg_amihud:
    stage: 3
    source: src/f1d/shared/variables/bgt_long_window_amihud.py (BGTLongWindowAmihudBuilder, 3-col output)
    column: BGTAvg_Amihud
    formula: Mean daily Amihud illiquidity over [-25, +25] trading days around call (51-day symmetric window, day 0 INCLUDED). F1D extension to BGT 2018.
    reference: bgt2018 (window); F1D extension (symmetric average shape)
    role: dv
    suites: [H7e]
    description: BGT 25-day symmetric average Amihud illiquidity (H7e).

  bgtavg_spread:
    stage: 3
    source: src/f1d/shared/variables/bgt_long_window_spread.py (BGTLongWindowSpreadBuilder, 3-col output)
    column: BGTAvg_Spread
    formula: Mean daily relative bid-ask spread over [-25, +25] trading days around call (51-day symmetric window, day 0 INCLUDED). Spread = (ASK - BID) / ((ASK + BID) / 2). F1D extension to BGT 2018.
    reference: bgt2018 (window); F1D extension (symmetric average shape)
    role: dv
    suites: [H14e]
    description: BGT 25-day symmetric average bid-ask spread (H14e).

  bgtdelta_amihud:
    stage: 3
    source: src/f1d/shared/variables/bgt_long_window_amihud.py (BGTLongWindowAmihudBuilder, 3-col output)
    column: BGTDelta_Amihud
    formula: Mean Amihud over post window [+1, +25] minus mean over pre window [-25, -1] trading days (day 0 EXCLUDED). F1D extension to BGT 2018.
    reference: bgt2018 (window); F1D extension (delta shape)
    role: dv
    suites: [H7d]
    description: BGT 25-day post-pre Amihud illiquidity change (H7d).

  bgtdelta_spread:
    stage: 3
    source: src/f1d/shared/variables/bgt_long_window_spread.py (BGTLongWindowSpreadBuilder, 3-col output)
    column: BGTDelta_Spread
    formula: Mean spread over [+1, +25] minus mean over [-25, -1] trading days (day 0 EXCLUDED). F1D extension to BGT 2018.
    reference: bgt2018 (window); F1D extension (delta shape)
    role: dv
    suites: [H14d]
    description: BGT 25-day post-pre bid-ask spread change (H14d).

  bgtlevel_amihud:
    stage: 3
    source: CRSP via get_raw_daily_data
    column: BGTLevel_Amihud
    formula: "CRSP via get_raw_daily_data (see module: src/f1d/shared/variables/bgt_long_window_amihud.py)"
    reference: "Bushee, Gow & Taylor (2018, JAR) 56(1):85-121"
    role: dv
    suites: [H7c]
    description: Compute BGT (2018) long-window Amihud illiquidity around earnings calls.

  bgtlevel_spread:
    stage: 3
    source: CRSP via get_raw_daily_data (closing BID/ASK)
    column: BGTLevel_Spread
    formula: "CRSP via get_raw_daily_data (closing BID/ASK) (see module: src/f1d/shared/variables/bgt_long_window_spread.py)"
    reference: "Bushee, Gow & Taylor (2018, JAR) [window]; Lee (2016, TAR) [formula]"
    role: dv
    suites: [H14c]
    description: Compute BGT (2018) long-window closing bid-ask spread around earnings calls.

  capex:
    stage: 3
    source: Compustat/capxy_Q4/atq
    column: Capex
    formula: "Compustat/capxy_Q4/atq (see module: src/f1d/shared/variables/capex_intensity.py)"
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: dv
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: Build Capex = capxy_annual / atq_lag from raw Compustat quarterly data.

  cash_flow_at:
    stage: 3
    source: Compustat/oancfy/atq
    column: CashFlowAt
    formula: "Compustat/oancfy/atq (see module: src/f1d/shared/variables/cash_flow.py)"
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H4b]
    description: Build CashFlow = oancfy / atq from raw Compustat quarterly data.

  cash_ratio:
    stage: 3
    source: Compustat/cheq/atq
    column: CashRatio
    formula: "Compustat/cheq/atq (see module: src/f1d/shared/variables/cash_holdings.py)"
    reference: bates2009 (Section II, p.1991; BKS use annual che/at — we use quarterly cheq/atq for panel alignment)
    role: dv
    suites: [H1, H1.1, H1.1b, H1.2, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.1, H13.2, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b]
    description: Build CashRatio = cheq / atq from raw Compustat quarterly data.

  chang_debt_choice:
    stage: 3
    source: src/f1d/shared/variables/_compustat_engine.py
    column: ChangDebtChoice
    formula: "see module: src/f1d/shared/variables/_compustat_engine.py"
    reference: cdh2006
    role: dv
    suites: [H20b]
    description: ChangDebtChoice (description not in module docstring)

  chang_external_funding:
    stage: 3
    source: src/f1d/shared/variables/_compustat_engine.py
    column: ChangExternalFunding
    formula: "see module: src/f1d/shared/variables/_compustat_engine.py"
    reference: cdh2006
    role: dv
    suites: [H19b]
    description: ChangExternalFunding (description not in module docstring)

  daily_vola:
    stage: 3
    source: CRSP/RET
    column: DailyVola
    formula: "Annualized standard deviation of CRSP daily returns over the inter-call window [prev_call_date + 5 days, call start_date - 5 days], requiring >= 10 trading days. Formula: std(daily_ret) * sqrt(252) * 100, expressed in percent."
    reference: dwz2021
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H4b, H7, H7b, H7c, H7d, H7e]
    description: Annualized stock-return volatility computed on the inter-call CRSP daily-return window.

  debt_to_capital:
    stage: 3
    source: Compustat/dlcq,dlttq,seqq
    column: DebtToCapital
    formula: "Compustat/dlcq,dlttq,seqq (see module: src/f1d/shared/variables/debt_to_capital.py)"
    reference: rz1995
    role: dv
    suites: [H4b]
    description: Build DebtToCapital = total debt / (equity + total debt).

  div_dummy:
    stage: 3
    source: "Compustat/dvy>0"
    column: DivDummy
    formula: "Compustat/dvy>0 (see module: src/f1d/shared/variables/dividend_payer.py)"
    reference: bates2009 (Section IV, p.2000; dividend payout dummy based on common dividends)
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H11, H11-Lag1, H11-Lag2, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: "Build DivDummy = (dvy > 0).astype(float) from raw Compustat quarterly data."

  div_payer_q:
    stage: 3
    source: "Compustat/dvpsxq>0 (quarterly ex-date)"
    column: DivPayerQ
    formula: "Compustat/dvpsxq>0 (quarterly ex-date) (see module: src/f1d/shared/variables/dividend_payer_quarterly.py)"
    reference: "Hoberg & Prabhala (2009, RFS) — Compustat item 26 (dvpsx) analog"
    role: dv
    suites: [H12b]
    description: "Build DivPayerQ = (dvpsxq > 0).astype(float) from raw Compustat quarterly data."

  earn_vol:
    stage: 3
    source: Compustat
    column: EarnVol
    formula: "Compustat (see module: src/f1d/shared/variables/earnings_volatility.py)"
    reference: duong2025 (Appendix B, p.30; 3-year rolling std of qoq asset-scaled earnings)
    role: control
    suites: [H11, H11-Lag1, H11-Lag2, H23, H24, H24b, H25]
    description: Builder for Earnings Volatility (earnings_volatility) variable.

  equity_delay_con:
    stage: 3
    source: inputs/Hoberg_Maksimovic/ (pre-computed) merged to panel
    column: EquityDelayCon
    formula: "Hoberg-Maksimovic (2015) firm-year equity-market financing constraint measure. Higher values = more constrained firm. Panel column is lowercase `equitydelaycon`; CamelCase name is the spec convention. See docs/provenance/h22.md for merge details."
    reference: hm2015
    role: dv
    suites: [H22]
    description: Hoberg-Maksimovic (2015) equity-market financing constraint index (H22).

  firm_mat:
    stage: 3
    source: Compustat
    column: FirmMat
    formula: "Compustat (see module: src/f1d/shared/variables/firm_maturity.py)"
    reference: biddle2009 (Appendix A, p.130; years since first CRSP appearance); alt leary2010 (App.~A p.354)
    role: control
    suites: [H11, H11-Lag1, H11-Lag2, H23, H24, H24b, H25]
    description: Builder for Firm Maturity (firm_maturity) variable.

  leverage:
    stage: 3
    source: Compustat/dlcq,dlttq,atq
    column: Leverage
    formula: "Compustat/dlcq,dlttq,atq (see module: src/f1d/shared/variables/book_lev.py)"
    reference: bks2009, rz1995
    role: dv
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H5, H7, H7b, H7c, H7d, H7e]
    description: Build Leverage = (dlcq + dlttq) / atq (interest-bearing debt only).

  loss:
    stage: 3
    source: Compustat ibq < 0
    column: Loss
    formula: "Compustat ibq < 0 (see module: src/f1d/shared/variables/loss_dummy.py)"
    reference: biddle2009 (Appendix A, p.131; indicator for negative net income before extraordinary items)
    role: control
    suites: [H5]
    description: Builder for Loss (H5 Control Variable).

  prisk:
    stage: 3
    source: Hassan et al. (2019) quarterly PRisk
    column: PRisk
    formula: "Hassan et al. (2019) quarterly PRisk (see module: src/f1d/shared/variables/prisk_q.py)"
    reference: hhlt2019
    role: iv
    suites: [H11]
    description: Match quarterly PRisk onto each earnings call by (gvkey, calendar_quarter).

  payout_ratio_q:
    stage: 3
    source: "Compustat/(dvpspq*cshoq)/ibq (quarterly)"
    column: PayoutRatio_q
    formula: "Compustat/(dvpspq*cshoq)/ibq (quarterly) (see module: src/f1d/shared/variables/payout_ratio_quarterly.py)"
    reference: dds2004
    role: dv
    suites: [H12]
    description: Build PayoutRatio_q = (dvpspq × cshoq) / ibq from Compustat.

  rdsales:
    stage: 3
    source: Compustat/xrdq,atq
    column: RDSales
    formula: "Compustat/xrdq,atq (see module: src/f1d/shared/variables/rd_intensity.py)"
    reference: bks2009, jjl2021
    role: dv
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H4b]
    description: Build RDSales = xrdq / atq from raw Compustat quarterly data.

  roa:
    stage: 3
    source: Compustat/iby,atq
    column: ROA
    formula: "Compustat/iby,atq (see module: src/f1d/shared/variables/roa.py)"
    reference: wang2020, dwz2021
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: Build ROA = iby_annual / avg_assets from Compustat quarterly data.

  repurchase_intensity:
    stage: 3
    source: Compustat/quarterly_prstkcy/lagged_atq
    column: RepurchaseIntensity
    formula: "Compustat/quarterly_prstkcy/lagged_atq (see module: src/f1d/shared/variables/repurchase_intensity.py)"
    reference: Thesis Advisor Suggestion
    role: dv
    suites: [H17]
    description: Build RepurchaseIntensity = quarterly_prstkcy / lagged_atq from Compustat.

  sales_growth:
    stage: 3
    source: Compustat/saley_Q4_YoY
    column: SalesGrowth
    formula: "Compustat/saley_Q4_YoY (see module: src/f1d/shared/variables/sales_growth.py)"
    reference: biddle2009 (Section 3.2, p.117; pct change in sales)
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H4b]
    description: Build SalesGrowth from raw Compustat quarterly data (annual Q4 panel).

  stock_price:
    stage: 3
    source: CRSP via get_raw_daily_data
    column: StockPrice
    formula: "CRSP via get_raw_daily_data (see module: src/f1d/shared/variables/stock_price.py)"
    reference: amiram2016 (Appendix A, p.137; daily CRSP stock price; justification cites Stoll 1978)
    role: control
    suites: [H14, H14b, H14c, H14d, H14e, H7, H7b, H7c, H7d, H7e]
    description: Compute stock price at earnings call date (VECTORIZED).

  surp_dec:
    stage: 3
    source: src/f1d/shared/variables/earnings_surprise.py (via IbesEngine)
    file_pattern: firm_controls_{year}.parquet
    column: SurpDec
    formula: "Signed quintile rank of percentage earnings surprise per DWZ 2021 Appendix Table A.1: raw surprise = (actual - consensus forecast earnings) / share price 5 trading days before announcement, x 100. Firms grouped into 5 bins of positive surprise (+5 largest through +1 smallest positive), 0 for zero surprises, and 5 bins of negative surprise (-1 smallest negative through -5 largest negative). DWZ footnote 32 notes this decile convention follows Hirshleifer, Lim & Teoh (2009) and DellaVigna & Pollet (2009)."
    reference: dzielinski2021 (Appendix Table A.1, p.55; convention cites DellaVigna-Pollet 2009 + Hirshleifer-Lim-Teoh 2009)
    role: control
    suites: [H5]
    description: Signed-quintile earnings surprise rank (-5 to +5) within calendar quarter.

  tobins_q:
    stage: 3
    source: "Compustat/(atq+cshoq*prccq-ceqq)/atq"
    column: TobinsQ
    formula: "Compustat/(atq+cshoq*prccq-ceqq)/atq (see module: src/f1d/shared/variables/tobins_q.py)"
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: "Build TobinsQ = (AT + cshoq*prccq - CEQ) / AT from raw Compustat quarterly data."

  turnover:
    stage: 3
    source: CRSP via get_raw_daily_data
    column: Turnover
    formula: "CRSP via get_raw_daily_data (see module: src/f1d/shared/variables/turnover.py)"
    reference: amihud2002 (Section 2.1, p.33; alt rolling-window def in chang2006 Appendix B p.3045)
    role: control
    suites: [H14, H14b, H14c, H14d, H14e, H7, H7b, H7c, H7d, H7e]
    description: Compute share turnover at earnings call date (VECTORIZED).

  ln_assets:
    stage: 3
    source: Compustat/atq
    column: lnAssets
    formula: "Compustat/atq (see module: src/f1d/shared/variables/size.py)"
    reference: dwz2021
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H11, H11-Lag1, H11-Lag2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H23, H24, H24b, H25, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: Build Size = ln(atq) from raw Compustat quarterly data.

  s_cfo:
    stage: 3
    source: Compustat/oancfy/atq_{t-1} rolling std
    column: sCFO
    formula: "Compustat/oancfy/atq_{t-1} rolling std (see module: src/f1d/shared/variables/ocf_volatility.py)"
    reference: biddle2009 (Appendix A, p.130; 5-year rolling std of CFO/avg assets)
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H4a, H4b, H5, H7, H7b, H7c, H7d, H7e]
    description: Build sCFO = rolling 5-year std (min 3 yrs) of (oancfy/atq_{t-1}) per gvkey.

  # ===========================================================================
  # Stage 4: Econometric / Indicator Variables
  # ===========================================================================

  below_ig:
    stage: 4
    source: "runtime (S&P credit rating subsample indicator)"
    column: BelowIG
    formula: "Binary = 1 if firm's S&P long-term issuer credit rating is below investment grade (BB+ and below) at call date; 0 otherwise. Rated firms only (Unrated firms get separate indicator)."
    reference: thesis (H1.2 rating subsample)
    role: iv
    suites: [H1.2]
    description: Below-IG credit rating subsample indicator (H1.2).

  high_tsimm:
    stage: 4
    source: runtime (within-year median split of TotalSimilarity)
    column: HighTSIMM
    formula: Binary = 1 if firm-year TotalSimilarity (HP 2016 product market similarity) is above the within-year median; 0 otherwise.
    reference: hp2016 (TSIMM construction); thesis (H1.1 split convention)
    role: iv
    suites: [H1.1b]
    description: High product-market-similarity indicator (H1.1).

  lagged_dv:
    stage: 4
    source: runtime (runner-constructed via .shift(1) within gvkey)
    column: Lagged_DV
    formula: 1-quarter lag of the dependent variable, constructed at runtime per spec (DV varies per suite). Always included as base control to absorb persistence.
    reference: thesis convention (per feedback_lagged_dv.md)
    role: control
    suites: [H1, H1.1, H1.1b, H1.2, H12, H12b, H13, H13.1, H13.2, H14, H14b, H14c, H14d, H14e, H16, H17, H18, H18b, H19b, H20b, H21, H22, H24, H24b, H25, H4a, H4b, H7, H7b, H7c, H7d, H7e]
    description: Generic lagged-DV control (1Q lag of suite-specific DV).

  unrated:
    stage: 4
    source: "runtime (S&P credit rating subsample indicator)"
    column: Unrated
    formula: "Binary = 1 if firm has no S&P rating at call date; 0 otherwise."
    reference: thesis (H1.2 rating subsample)
    role: iv
    suites: [H1.2]
    description: No-rating subsample indicator (H1.2).

  z_log_total_similarity:
    stage: 4
    source: runtime (transformation of HP 2016 TSIMM)
    column: z_log_TotalSimilarity
    formula: z-score of log(1 + TotalSimilarity) computed within year. TotalSimilarity = HP 2016 firm-year product market similarity score (sum of pairwise cosine similarities × 100).
    reference: hp2016
    role: iv
    suites: [H23]
    description: z-scored log of HP 2016 product-market-similarity (IV in H23 competition test).

  # ===========================================================================
  # Stage 5: Runtime Derivatives (lead/lag/centered/interaction)
  # ===========================================================================

  abs_surp_dec:
    stage: 5
    source: "runtime (runner computes |SurpDec|; see run_h14c/d/e)"
    column: AbsSurpDec
    formula: abs(SurpDec) — unsigned magnitude of signed-quintile earnings surprise rank, values 0-5.
    reference: thesis (magnitude control independent of sign)
    role: control
    suites: [H14, H14c, H14d, H14e]
    description: Absolute earnings surprise quintile magnitude.

  bgtavg_amihud_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: BGTAvg_Amihud_lead1
    formula: 1-quarter lead of BGTAvg_Amihud
    reference: bgt2018 (window); F1D extension (symmetric average shape)
    role: dv
    suites: [H7e]
    description: 1Q lead of BGTAvg_Amihud.

  bgtavg_spread_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: BGTAvg_Spread_lead1
    formula: 1-quarter lead of BGTAvg_Spread
    reference: bgt2018 (window); F1D extension (symmetric average shape)
    role: dv
    suites: [H14e]
    description: 1Q lead of BGTAvg_Spread.

  bgtdelta_amihud_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: BGTDelta_Amihud_lead1
    formula: 1-quarter lead of BGTDelta_Amihud
    reference: bgt2018 (window); F1D extension (delta shape)
    role: dv
    suites: [H7d]
    description: 1Q lead of BGTDelta_Amihud.

  bgtdelta_spread_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: BGTDelta_Spread_lead1
    formula: 1-quarter lead of BGTDelta_Spread
    reference: bgt2018 (window); F1D extension (delta shape)
    role: dv
    suites: [H14d]
    description: 1Q lead of BGTDelta_Spread.

  bgtlevel_amihud_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: BGTLevel_Amihud_lead1
    formula: 1-quarter lead of BGTLevel_Amihud
    reference: bgt2018
    role: dv
    suites: [H7c]
    description: 1Q lead of BGTLevel_Amihud.

  bgtlevel_spread_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: BGTLevel_Spread_lead1
    formula: 1-quarter lead of BGTLevel_Spread
    reference: bgt2018, lee2016
    role: dv
    suites: [H14c]
    description: 1Q lead of BGTLevel_Spread.

  capex_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: Capex_lead
    formula: 1-quarter lead of Capex
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: dv
    suites: [H13, H13.1, H13.2]
    description: 1Q lead of Capex.

  capex_lead2:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: Capex_lead2
    formula: 2-quarter lead of Capex
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: dv
    suites: [H13.2]
    description: 2Q lead of Capex.

  capex_lead3:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: Capex_lead3
    formula: 3-quarter lead of Capex
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: dv
    suites: [H13.2]
    description: 3Q lead of Capex.

  capex_lead4:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: Capex_lead4
    formula: 4-quarter lead of Capex
    reference: "Bates, Kahle & Stulz (2009, JF)"
    role: dv
    suites: [H13.2]
    description: 4Q lead of Capex.

  cash_ratio_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: CashRatio_lead
    formula: 1-quarter lead of CashRatio
    reference: see base var
    role: dv
    suites: [H1]
    description: 1Q lead of CashRatio.

  chang_debt_choice_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: ChangDebtChoice_lead
    formula: 1-quarter lead of ChangDebtChoice
    reference: cdh2006
    role: dv
    suites: [H20b]
    description: 1Q lead of ChangDebtChoice.

  chang_external_funding_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: ChangExternalFunding_lead
    formula: 1-quarter lead of ChangExternalFunding
    reference: cdh2006
    role: dv
    suites: [H19b]
    description: 1Q lead of ChangExternalFunding.

  disp_lag:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: DISP_lag
    formula: 1-quarter lag of DISP
    reference: wang2020
    role: control
    suites: [H5]
    description: 1Q lag of DISP.

  disp_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: DISP_lead
    formula: 1-quarter lead of DISP
    reference: wang2020
    role: dv
    suites: [H5]
    description: 1Q lead of DISP.

  dspread_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: DSPREAD_lead1
    formula: 1-quarter lead of DSPREAD
    reference: lee2016
    role: dv
    suites: [H14]
    description: 1Q lead of DSPREAD.

  debt_to_capital_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: DebtToCapital_lead
    formula: 1-quarter lead of DebtToCapital
    reference: rz1995
    role: dv
    suites: [H4b]
    description: 1Q lead of DebtToCapital.

  delta_illiq_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: DeltaILLIQ_lead1
    formula: 1-quarter lead of DeltaILLIQ
    reference: amihud02
    role: dv
    suites: [H7]
    description: 1Q lead of DeltaILLIQ.

  div_payer_q_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: DivPayerQ_lead1
    formula: 1-quarter lead of DivPayerQ
    reference: "Hoberg & Prabhala (2009, RFS) -- primary; Chetty & Saez (2005, QJE) -- secondary (firm-quarter frequency precedent)"
    role: dv
    suites: [H12b]
    description: 1Q lead of DivPayerQ.

  equity_delay_con_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: EquityDelayCon_lead
    formula: 1-quarter lead of EquityDelayCon
    reference: hm2015
    role: dv
    suites: [H22]
    description: 1Q lead of EquityDelayCon.

  leverage_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: Leverage_lead
    formula: 1-quarter lead of Leverage
    reference: bks2009, rz1995
    role: dv
    suites: [H4a]
    description: 1Q lead of Leverage.

  prisk_lag:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: PRisk_lag
    formula: 1-quarter lag of PRisk
    reference: hhlt2019
    role: iv
    suites: [H11-Lag1]
    description: 1Q lag of PRisk.

  prisk_lag2:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: PRisk_lag2
    formula: 2-quarter lag of PRisk
    reference: hhlt2019
    role: iv
    suites: [H11-Lag2]
    description: 2Q lag of PRisk.

  payout_ratio_q_lead_qtr:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: PayoutRatio_q_lead_qtr
    formula: 1-quarter lead of PayoutRatio_q (calendar-quarter aligned)
    reference: dds2004
    role: dv
    suites: [H12]
    description: 1Q lead of PayoutRatio_q (qtr-aligned).

  post_call_amihud:
    stage: 5
    source: runtime (panel-time computation in H7b runner)
    column: PostCallAmihud
    formula: Panel-time mean daily Amihud illiquidity over the post-call period (call quarter + N following quarters per H7b runner spec). Computed on panel structure with two-way clustering.
    reference: thesis (H7b panel-time post-call construction)
    role: dv
    suites: [H7b]
    description: Panel-time post-call Amihud illiquidity level (H7b).

  post_call_amihud_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: PostCallAmihud_lead1
    formula: 1-quarter lead of PostCallAmihud
    reference: thesis (H7b panel-time post-call construction)
    role: dv
    suites: [H7b]
    description: 1Q lead of PostCallAmihud.

  post_call_spread:
    stage: 5
    source: runtime (panel-time computation in H14b runner)
    column: PostCallSpread
    formula: Panel-time mean daily relative bid-ask spread over the post-call period (call quarter + N following quarters per H14b runner spec). Computed on panel structure with two-way clustering.
    reference: thesis (H14b panel-time post-call construction)
    role: dv
    suites: [H14b]
    description: Panel-time post-call bid-ask spread level (H14b).

  post_call_spread_lead1:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: PostCallSpread_lead1
    formula: 1-quarter lead of PostCallSpread
    reference: thesis (H14b panel-time post-call construction)
    role: dv
    suites: [H14b]
    description: 1Q lead of PostCallSpread.

  rdsales_lead:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: RDSales_lead
    formula: 1-quarter lead of RDSales
    reference: bks2009, jjl2021
    role: dv
    suites: [H16]
    description: 1Q lead of RDSales.

  repurchase_intensity_lead_qtr:
    stage: 5
    source: runtime (runner .shift in gvkey group)
    column: RepurchaseIntensity_lead_qtr
    formula: 1-quarter lead of RepurchaseIntensity (calendar-quarter aligned)
    reference: Thesis Advisor Suggestion
    role: dv
    suites: [H17]
    description: 1Q lead of RepurchaseIntensity (qtr-aligned).

  unc_ans_mgr_c:
    stage: 5
    source: runtime (sample mean subtracted)
    column: UncAnsMgr_c
    formula: UncAnsMgr minus its sample mean (mean-centered for interaction interpretability)
    reference: thesis (interaction interpretability)
    role: iv
    suites: [H1.1, H1.1b, H1.2, H13.1]
    description: Mean-centered UncAnsMgr.

  unc_ans_mgr_c_x_below_ig:
    stage: 5
    source: runtime (product of two predictors)
    column: UncAnsMgr_c_x_BelowIG
    formula: "Product: UncAnsMgr_c * BelowIG"
    reference: thesis (interaction term)
    role: iv
    suites: [H1.2]
    description: "Interaction term: UncAnsMgr_c x BelowIG."

  unc_ans_mgr_c_x_high_tsimm:
    stage: 5
    source: runtime (product of two predictors)
    column: UncAnsMgr_c_x_HighTSIMM
    formula: "Product: UncAnsMgr_c * HighTSIMM"
    reference: thesis (interaction term)
    role: iv
    suites: [H1.1b]
    description: "Interaction term: UncAnsMgr_c x HighTSIMM."

  unc_ans_mgr_c_x_ig:
    stage: 5
    source: runtime (product of two predictors)
    column: UncAnsMgr_c_x_IG
    formula: "Product: UncAnsMgr_c * IG"
    reference: thesis (interaction term)
    role: iv
    suites: [H1.2]
    description: "Interaction term: UncAnsMgr_c x IG."

  unc_ans_mgr_c_x_unrated:
    stage: 5
    source: runtime (product of two predictors)
    column: UncAnsMgr_c_x_Unrated
    formula: "Product: UncAnsMgr_c * Unrated"
    reference: thesis (interaction term)
    role: iv
    suites: [H1.2]
    description: "Interaction term: UncAnsMgr_c x Unrated."

  unc_ans_mgr_c_x_zlog_tsimm:
    stage: 5
    source: runtime (product of two predictors)
    column: UncAnsMgr_c_x_zlogTSIMM
    formula: "Product: UncAnsMgr_c * zlogTSIMM"
    reference: thesis (interaction term)
    role: iv
    suites: [H1.1, H13.1]
    description: "Interaction term: UncAnsMgr_c x zlogTSIMM."

  # ===========================================================================
  # Other / Unclassified
  # ===========================================================================

  cccl:
    stage: 9
    source: inputs/EDGAR_CommentLetters
    column: CCCL
    formula: 1 if SEC comment letter received in next quarter, 0 otherwise
    reference: cdm2013
    role: dv
    suites: [H18, H18b]
    description: SEC comment letter received (binary, forward-looking)

  disp:
    stage: 9
    source: inputs/tr_ibes
    column: DISP
    formula: SD(latest analyst EPS forecasts in T-31..T-1 window) / prccq_prior
    reference: wang2020
    role: dv
    suites: [H5]
    description: Analyst forecast dispersion (Wang 2020)

  dspread:
    stage: 9
    source: inputs/CRSP_DSF
    column: DSPREAD
    formula: "mean(RelSpread[+1,+3]) - mean(RelSpread[-3,-1]) where RelSpread = 2*(ASK-BID)/(ASK+BID)"
    reference: lee2016
    role: dv
    suites: [H14]
    description: Change in closing bid-ask spread around earnings call

  delta_illiq:
    stage: 9
    source: inputs/CRSP_DSF
    column: DeltaILLIQ
    formula: PostCallILLIQ - PreCallILLIQ over [+1,+3] vs [-3,-1] days
    reference: amihud02
    role: dv
    suites: [H7]
    description: Change in Amihud illiquidity around earnings call

  gepu_log:
    stage: 9
    source: inputs/EconomicPolicyUncertaintyIndex/Global
    file_name: Global_Policy_Uncertainty_Data.xlsx
    column: GEPU_log
    formula: log(GEPU_current) — GDP-weighted average of 16 country EPU indices, matched by calendar month of call start_date
    reference: davis2016
    role: iv
    suites: [H24b]
    description: Davis (2016, NBER WP 22740) Global Economic Policy Uncertainty (GEPU) index (log-transformed, current-$ GDP weights)

  gpr_log:
    stage: 9
    source: inputs/matteoiacoviello/GPR_Global
    file_name: data_gpr_export.xls
    column: GPR_log
    formula: log(GPR) — recent headline Geopolitical Risk index, matched by calendar month of call start_date
    reference: ci2022
    role: iv
    suites: [H25]
    description: "Caldara & Iacoviello (2022, AER) headline Geopolitical Risk index (log-transformed, 10-newspaper recent version)"

  sec_letters_fwd:
    stage: 9
    source: inputs/EDGAR_CommentLetters
    column: SEC_Letters_fwd
    formula: Count of SEC-originated letters (UPLOAD type) in next calendar quarter
    reference: cdm2013 (thesis extension to count)
    role: dv
    suites: [H21]
    description: SEC comment letter count (forward-looking)

  total_similarity:
    stage: 9
    source: inputs/TNIC
    column: TotalSimilarity
    formula: Sum of pairwise cosine similarities from 10-K product descriptions
    reference: hp2016
    role: control
    suites: []
    description: Hoberg-Phillips total product similarity

  us_epu_log:
    stage: 9
    source: inputs/EconomicPolicyUncertaintyIndex/US
    file_name: US_Policy_Uncertainty_Data.xlsx
    column: US_EPU_log
    formula: log(News_Based_Policy_Uncert_Index) matched by calendar month of call start_date
    reference: bbd2016
    role: iv
    suites: [H24]
    description: "Baker, Bloom & Davis (2016, QJE) US News-Based Economic Policy Uncertainty index (log-transformed)"

