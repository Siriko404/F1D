# Summary Stats Table 1 configuration
#
# v6 SCOPE LOCK (2026-04-29 LATE×9 user directive: "we DO NOT MENTION ANYTHING
# WE DONT REPORT"). include_suites RESTRICTED to thesis_suites only — the
# 14 v6 body suites whose tables are cited in main.pdf. Variable list is
# whatever those suites' specs declare as IVs/DVs/controls; runtime-computed
# IVs (ClarityCEO, UncResCEO) sourced from per-suite runner summary_stats.csv
# fallback.

include_suites:
  # HC main (Full + QtrExp decomp)
  - H1.ceo2.decomp
  - H1.ceo2.decomp.qtrexp
  # HFC moderator (Full + QtrExp decomp)
  - H1.2.ceo2.decomp
  - H1.2.ceo2.decomp.qtrexp
  # §3.4 CFvol moderator
  - H1.3.cfvol
  # §4.1 drivers
  - H11
  - H11-Lag2
  - H23
  - H24
  - H24b
  # §4.2 reaction
  - H14c.ceo2.decomp
  - H18.ceo2.decomp
  # §4.3 endogeneity suites (H.death.did, H.dwz.fd, H.lewbel.iv) have non-
  # canonical suite_spec schemas + treated/post/event-difference IVs that
  # don't map to summary-stat reporting. Their cash DV + ClarityCEO/UncResCEO
  # stats are already provided by H1.ceo2.decomp; no info loss from omission.

# Anchor panel per variable — where to pull observations from for a shared var.
# Default (unset) = first-encountered suite in render order. Sources thesis_suites
# panels for shared controls; runtime-computed v6 IVs fall back to runner CSV.
anchor_panel:
  UncPreCEO: H1.ceo2.decomp
  CashRatio: H1.ceo2.decomp
  CashRatio_lead: H1.ceo2.decomp
  lnAssets: H1.ceo2.decomp
  TobinsQ: H1.ceo2.decomp
  ROA: H1.ceo2.decomp
  Leverage: H1.ceo2.decomp
  Capex: H1.ceo2.decomp
  DivDummy: H1.ceo2.decomp
  sCFO: H1.ceo2.decomp
  SalesGrowth: H1.ceo2.decomp
  RDSales: H1.ceo2.decomp
  CashFlowAt: H1.ceo2.decomp
  DailyVola: H1.ceo2.decomp

# Variables to skip (placeholders, mean-centered duplicates, interactions).
exclude_vars:
  - Lagged_DV
  - UncResCEO_c
  - UncResCEO_QtrExp_c
  - ClarityCEO_c
  - ClarityCEO_QtrExp_c
  - UncPreCEO_c
  # HFC interaction terms (runtime constructs)
  - UncResCEO_c_x_Unrated
  - ClarityCEO_c_x_Unrated
  - UncPreCEO_c_x_Unrated
  - UncResCEO_QtrExp_c_x_Unrated
  - ClarityCEO_QtrExp_c_x_Unrated
  # CFvol interaction terms
  - UncResCEO_c_x_HighCFvol
  - ClarityCEO_c_x_HighCFvol
  - UncPreCEO_c_x_HighCFvol
  - HighCFvol
  # H23 competition transformations
  - z_log_TotalSimilarity
  - HighTSIMM
  - UncAnsMgr_c_x_zlogTSIMM
  - UncAnsMgr_c_x_HighTSIMM
  # Legacy v5 IV interactions (parents of decomp)
  - UncAnsCEO_c
  - UncAnsMgr_c
  - UncPreMgr_c
  - UncAnsMgr_c_x_BelowIG
  - UncAnsMgr_c_x_IG
  - UncAnsMgr_c_x_Unrated
  # Driver/Reaction suites still report 6-DV partition rows in their parents;
  # body §4.1 (Path a rebuild pending) should drop these. Until rebuild lands,
  # exclude here so summary stats remain v6-scope-clean.
  - UncAnsMgr
  - UncPreMgr
  - UncAnsCEO
  - UncAnsNoCEO
  - UncPreNoCEO

# Sub-suite spec.dir_name → parent builder's actual panel directory.
# Many runners (H7b/c/d/e, H14b-e, H12b, H18b, H19b, H20b, H1.1/H1.2, H24-H25,
# H13.1) emit their own logical dir_name in the spec but reuse a parent
# suite's panel. This map routes them correctly.
# H1.1/H1.1b/H1.2 → h1_cash_holdings: their rating-based subsample indicators
# (BelowIG, IG, Unrated) are constructed at runtime in the runner from
# external rating data, NOT stored in any panel. They are absent from Table 1.
panel_dir_alias:
  # v6 thesis_suites — all decomp variants reuse h1_cash_holdings panel
  H1.ceo2.decomp: h1_cash_holdings
  H1.ceo2.decomp.qtrexp: h1_cash_holdings
  H1.2.ceo2.decomp: h1_cash_holdings
  H1.2.ceo2.decomp.qtrexp: h1_cash_holdings
  H1.3.cfvol: h1_cash_holdings
  H14c.ceo2.decomp: h14_bidask_spread
  H18.ceo2.decomp: h18_cccl_received
  # Endogeneity suites reuse h1_cash_holdings (cash DV)
  H.dwz.fd: h1_cash_holdings
  H.lewbel.iv: h1_cash_holdings
  # Legacy aliases retained for fallback compat (other configs may still resolve them)
  H1.1: h1_cash_holdings
  H1.1.r: h1_cash_holdings
  H1.1b: h1_cash_holdings
  H1.1b.r: h1_cash_holdings
  H1.2: h1_cash_holdings
  H1.2.r: h1_cash_holdings
  H1.r: h1_cash_holdings
  H7b: h7_illiquidity
  H7c: h7_illiquidity
  H7d: h7_illiquidity
  H7e: h7_illiquidity
  H12b: h12_payout
  H13.1: h13_capex
  H14b: h14_bidask_spread
  H14c: h14_bidask_spread
  H14c.ceo2.decomp: h14_bidask_spread  # DWZ decomp reaction — reuses H14 panel
  H14d: h14_bidask_spread
  H14e: h14_bidask_spread
  H18b: h18_cccl_received
  H19b: h19b_h20b_financing
  H20b: h19b_h20b_financing
  H24: h24_h24b_h25_macro
  H24b: h24_h24b_h25_macro
  H25: h24_h24b_h25_macro
  # Partition variant siblings — all reuse parent panels (with NoCEO cols added 2026-04-19)
  H4a.r: h4_leverage
  H4b.r: h4_leverage
  H5.r: h5b_wang_disp
  H7.r: h7_illiquidity
  H7b.r: h7_illiquidity
  H7c.r: h7_illiquidity
  H7d.r: h7_illiquidity
  H7e.r: h7_illiquidity
  H12.r: h12_payout
  H12b.r: h12_payout
  H13.r: h13_capex
  H13.2.r: h13_2_capex_leads
  H13.1.r: h13_capex   # CEO partition channel — reuses H13 panel
  H13.3: h13_capex     # NEW capex x constraint channel — reuses H13 panel
  H14.r: h14_bidask_spread
  H14b.r: h14_bidask_spread
  H14c.r: h14_bidask_spread
  H14d.r: h14_bidask_spread
  H14e.r: h14_bidask_spread
  H16.r: h16_rd_sales
  H17.r: h17_repurchase_intensity
  H18.r: h18_cccl_received
  H18b.r: h18_cccl_received
  H19b.r: h19b_h20b_financing
  H20b.r: h19b_h20b_financing
  H21.r: h21_sec_letters
  H22.r: h22_equity_constraints

# Supplementary substantive variables NOT in any spec's IV/DV/Control list.
# Use for raw economic measures whose transformed form (z-scored, logged) is
# what enters the regression. Reader needs the raw form for interpretation.
extra_vars:
  - name: TotalSimilarity
    anchor: H23
    panel: "A. Independent Variables"
    note: "HP 2016 raw TSIMM; H23 regression uses z_log_TotalSimilarity"
