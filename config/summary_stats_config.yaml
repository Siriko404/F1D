  H20b.r: h19b_h20b_financing
  H21.r: h21_sec_letters
  H22.r: h22_equity_constraints

# Supplementary substantive variables NOT in any thesis-suite spec's IV/DV/Control
# list. The empire/scrutiny vars: derived analyst-scrutiny measures constructed on
# EMPIRE (CashScrutiny/HighCashScrutiny/HighCash) + the H1 firm controls the
# convergent specs omit (Leverage/Capex/sCFO). All anchored on EMPIRE (h1 universe).
extra_vars:
  - {name: PreAnnounceQtr,   anchor: EMPIRE, panel: "A. Independent Variables", note: "run-up treatment: 1[quarter before firm's first >=50%-cash deal]; full Main panel"}
  - {name: CashScrutiny,     anchor: EMPIRE, panel: "A. Independent Variables", note: "% analyst Q&A turns on cash/liquidity (= stock_score*100)"}
  - {name: HighCashScrutiny, anchor: EMPIRE, panel: "A. Independent Variables", note: "1[CashScrutiny > median]; median=0 -> any cash scrutiny"}
  - {name: HighCash,         anchor: EMPIRE, panel: "C. Firm Controls", note: "1[CashRatio >= top tercile]"}
  - {name: UncAnsCEO,        anchor: EMPIRE, panel: "B. Dependent Variables", note: "raw CEO Q&A uncertainty (DWZ eq-2 LHS); residual = UncResCEO; reported in tab:cash_scrutiny_channel"}
  - {name: BGTLevel_Spread,  anchor: SPREAD, panel: "B. Dependent Variables", note: "25-day post-call quoted bid-ask spread (Section 4.2 reaction DV, tab:h14c_ceo2_decomp); Main sample"}
  - {name: CashRatio_lag,    anchor: EMPIRE, panel: "C. Firm Controls", note: "CashRatio one-quarter lag (partial-adjustment control in MA1/MA2/MA3)"}
  - {name: Leverage,         anchor: EMPIRE, panel: "C. Firm Controls", note: "H1 control set; not in convergent specs"}
  - {name: Capex,            anchor: EMPIRE, panel: "C. Firm Controls", note: "H1 control set; not in convergent specs"}
  - {name: sCFO,             anchor: EMPIRE, panel: "C. Firm Controls", note: "H1 control set; not in convergent specs"}
