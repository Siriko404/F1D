# a runner via write_suite_spec(). The consolidated renderer
# (outputs/generate_all_tables.py) iterates this list and loads
# suite_spec_<id>.json from the latest timestamped output directory.
#
# Adding or reordering a suite: edit this file + ensure the corresponding
# runner emits the spec file. No metadata here — just identity + order.

