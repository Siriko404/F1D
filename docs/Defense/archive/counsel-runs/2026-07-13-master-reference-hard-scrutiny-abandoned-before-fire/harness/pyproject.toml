[project]
name = "defense-counsel-harness"
version = "0.1.0"
description = "Restricted Agno harness for the ratified thesis-defense counsel"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agno==2.7.2",
  "aiosqlite>=0.20,<1",
  "ddgs>=9,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/counsel_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

